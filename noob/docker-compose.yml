# docker-compose.yml

services:
  # ============================================
  # База данных
  # ============================================
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: pirate_db
      POSTGRES_USER: pirate_user
      POSTGRES_PASSWORD: pirate_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pirate_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Redis (брокер сообщений для Celery)
  # ============================================
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
    # Добавляем персистентность для Redis (чтобы не терять задачи при перезапуске)
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ============================================
  # Веб-приложение Django
  # ============================================
  web:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    restart: unless-stopped

  # ============================================
  # Celery Worker (выполняет фоновые задачи)
  # ============================================
  worker:
    build: .
    env_file:
      - .env
    command: celery -A noob worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media_volume:/app/media  # если задачи работают с файлами
    restart: unless-stopped

  # ============================================
  # Celery Beat (запускает периодические задачи)
  # ============================================
  beat:
    build: .
    env_file:
      - .env
    command: celery -A noob beat -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ============================================
  # Flower (мониторинг Celery)
  # ============================================
  flower:
    build:
      context: .
      dockerfile: Dockerfile.flower  # используем специальный Dockerfile
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    restart: unless-stopped

# ============================================
# Тома (volumes)
# ============================================
volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_data:  # новый том для персистентности Redis
