<!DOCTYPE html>
<html>
<head>
    <title>Редактировать профиль | Морской розыск</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'nob/style.css' %}">
    <link rel="stylesheet" href="{% static 'nob/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'nob/profile.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    {% include 'nob/navbar.html' %}

    <div class="profile-container">
        <div class="archive-decoration">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <header class="archive-header">
            <h1 class="archive-title">EDIT</h1>
            <p class="archive-subtitle">РЕДАКТИРОВАНИЕ ПРОФИЛЯ</p>
            <div class="title-ornament">
                <span>✎</span>
                <span>☠</span>
                <span>✎</span>
            </div>
        </header>

        <div class="edit-form-container">
            <form method="post" enctype="multipart/form-data" class="pirate-form">
                {% csrf_token %}

                <div class="form-group">
                    <label for="{{ form.image.id_for_label }}">АВАТАР</label>
                    {{ form.image }}
                    {% if profile.image %}
                        <div class="current-image">
                            <p>Текущее изображение:</p>
                            <img src="{{ profile.image.url }}" alt="Текущее фото" class="thumbnail">
                        </div>
                    {% endif %}
                </div>

                <div class="form-group">
                    <label for="{{ form.organization.id_for_label }}">ОРГАНИЗАЦИЯ</label>
                    {{ form.organization }}
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">СОХРАНИТЬ</button>
                    <a href="{% url 'profile_self' %}" class="cancel-btn">ОТМЕНА</a>
                </div>
            </form>
        </div>

        <footer class="archive-footer">
            <div class="footer-line"></div>
            <p>Бюро морской разведки • Все права защищены • Эпоха великих пиратов</p>
            <div class="footer-line"></div>
        </footer>
    </div>
</body>
</html>
