{% load static %}
<nav class="navbar">
    <div class="nav-left">
        <a href="{% url 'basepage' %}" class="nav-btn">🏴‍☠️ HARBOR</a>
        {% if user.is_authenticated and user.profile.role in 'official admin' %}
            <a href="{% url 'post_create' %}" class="nav-link">➕ NEW POST</a>
        {% endif %}
    </div>
    <div class="nav-right">
        {% if user.is_authenticated %}
            <div class="user-menu">
                <a href="{% url 'profile_self' %}" class="profile-link">
                    {% if user.profile.image %}
                        <img src="{{ user.profile.image.url }}" alt="avatar" class="nav-avatar">
                    {% else %}
                        <span class="nav-avatar-placeholder">☠</span>
                    {% endif %}
                    <span class="username">{{ user.username }}</span>
                </a>
                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" style="background: none; border: none; color: #007bff; cursor: pointer;">
                        Выйти
                    </button>
                </form>
            </div>
        {% else %}
            <a href="{% url 'login' %}" class="nav-link">Set Sail</a>
            <a href="{% url 'register' %}" class="nav-link">Sign Up</a>
        {% endif %}
    </div>
</nav>
