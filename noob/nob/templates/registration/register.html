<!DOCTYPE html>
<html>
<head>
    <title>Регистрация пирата</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>
    <h1>🏴‍☠️ Стань пиратом!</h1>

        {% csrf_token %}

    <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</body>
</html>
