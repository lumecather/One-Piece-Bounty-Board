<!DOCTYPE html>
<html>
<head>
    <title>Вход для пиратов</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>
    <h1>⚓ Вход в гавань</h1>

    {% if form.errors %}
        <p style="color: red;">Неверное имя или пароль. Попробуй ещё, салага!</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Войти</button>
    </form>

    <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    <p><a href="{% url 'basepage' %}">На главную</a></p>
</body>
</html>
