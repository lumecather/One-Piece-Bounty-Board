<!DOCTYPE html>
<html>
<head>
    <title>Login | Marine Bounty</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'nob/style.css' %}">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 20px;
        }
        .auth-card {
            background: linear-gradient(135deg, rgba(26,20,15,0.95), rgba(20,15,10,0.98));
            border: 2px solid #8b5a2b;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .auth-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #ffd966;
            margin-bottom: 10px;
        }
        .auth-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
            color: #b87333;
            margin-bottom: 30px;
        }
        .auth-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #8b5a2b;
            border-radius: 6px;
            color: #e8ddc3;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            box-sizing: border-box;
        }
        .auth-form button {
            width: 100%;
            padding: 12px;
            background: #b87333;
            color: white;
            border: none;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .auth-form button:hover {
            background: #c9772e;
            transform: translateY(-2px);
        }
        .auth-links {
            margin-top: 25px;
            font-size: 14px;
        }
        .auth-links a {
            color: #b87333;
            text-decoration: none;
        }
        .auth-links a:hover {
            color: #ffd966;
        }
        .error-message {
            color: #ff6b6b;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-title">⚓ ENTER THE HARBOR</div>
            <div class="auth-subtitle">AUTHORIZED PERSONNEL ONLY</div>

            {% if form.errors %}
                <div class="error-message">❌ Incorrect username or password</div>
            {% endif %}

            <form method="post" class="auth-form">
                {% csrf_token %}
                <input type="text" name="username" placeholder="PIRATE NAME" autocomplete="off">
                <input type="password" name="password" placeholder="PASSWORD">
                <button type="submit">LOGIN</button>
            </form>

            <div class="auth-links">
                <p>No account? <a href="{% url 'register' %}">Sign up</a></p>
                <p><a href="{% url 'basepage' %}">← Back to home</a></p>
            </div>
        </div>
    </div>
</body>
</html>
